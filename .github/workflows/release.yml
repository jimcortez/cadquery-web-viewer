name: Release

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check_recursive.outputs.skip || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
      - id: check_recursive
        run: |
          git fetch --tags
          # Dereference to the underlying commit so annotated tags compare correctly
          # (`git rev-parse refs/tags/<tag>` returns the tag-object SHA for annotated
          # tags, not the commit SHA, which would always look "recursive").
          tag_commit=$(git rev-parse "${{ github.ref }}^{commit}")
          main_commit=$(git rev-parse main)
          if [ "$tag_commit" != "$main_commit" ]; then
              echo "::warning::The tag commit $tag_commit does not match the latest main commit $main_commit. This is probably a recursive tag push that will be ignored."
              echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "CLEAN_VERSION=${{ github.ref }}" | sed 's,refs/tags/v,,g' >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Enable Corepack
        # See build-reusable.yml — `cache: yarn` collides with the Yarn 4
        # packageManager pin via the runner's pre-installed Yarn 1.
        run: corepack enable
      - name: Bump package.json version (single source of truth)
        # Avoid `yarn version <ver>` because Yarn 4's plugin-version defaults
        # to deferred mode (writes to .yarn/versions/, not package.json), which
        # leaves nothing for the subsequent `git commit -am` to commit.
        # Update package.json directly with Node — no Yarn semantics involved.
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.CLEAN_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "package.json after bump:"
          grep '"version"' package.json
      - if: steps.check_recursive.outputs.skip != 'true'
        # If the version was bumped, commit + force-push tag. If the working
        # copy already matches CLEAN_VERSION (e.g. someone pre-bumped before
        # tagging), continue silently — the tag already points at the right
        # commit and downstream jobs can run as-is.
        run: |
          if [ -z "$(git status --porcelain package.json)" ]; then
            echo "package.json is already at $CLEAN_VERSION; no version-bump commit needed."
            exit 0
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Automatically update version to $CLEAN_VERSION" package.json
          git push
          git tag -f -a "v$CLEAN_VERSION" -m "v$CLEAN_VERSION"
          git push -f --tags

  rebuild:
    needs: update-versions
    if: needs.update-versions.outputs.skip != 'true'
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      ref: main
      vite_base: ${{ vars.PAGES_BASE || '' }}

  deploy-pages:
    needs: rebuild
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-dist
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Zip static site for GitHub Release
        run: (cd site && zip -r "$GITHUB_WORKSPACE/cadquery-web-viewer-${{ github.ref_name }}-frontend.zip" .)
      - name: Upload static site to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: cadquery-web-viewer-${{ github.ref_name }}-frontend.zip
          tag: ${{ github.ref }}
          overwrite: true

  deploy-pypi:
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
      - name: Attach wheel and sdist to GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # No actions/checkout in this job; gh needs an explicit repo.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          assets=("${wheels[@]}" "${sdists[@]}")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No .whl or .tar.gz found in dist/"
            ls -la dist
            exit 1
          fi
          # Release may already exist (e.g. deploy-pages uploaded the frontend zip first).
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  deploy-ghcr:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ github.token }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=true
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # amd64 only — see build-reusable.yml: cadquery-ocp 7.8.x has no
          # manylinux_aarch64 wheel.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docker:
    needs: rebuild
    if: ${{ vars.DOCKERHUB_IMAGE != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ github.token }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=true
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # amd64 only — see build-reusable.yml: cadquery-ocp 7.8.x has no
          # manylinux_aarch64 wheel.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
