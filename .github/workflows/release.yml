name: Release

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check_recursive.outputs.skip || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}
      - id: check_recursive
        run: |
          git fetch --tags
          tag_commit=$(git rev-parse "${{ github.ref }}")
          master_commit=$(git rev-parse master)
          if [ "$tag_commit" != "$master_commit" ]; then
              echo "::warning::The tag commit $tag_commit does not match the latest master commit $master_commit. This is probably a recursive tag push that will be ignored."
              echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "CLEAN_VERSION=${{ github.ref }}" | sed 's,refs/tags/v,,g' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true
          cache: yarn
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn version --new-version "$CLEAN_VERSION" --no-git-tag-version
      - uses: astral-sh/setup-uv@v5
      - run: sed -i "s/^version = .*/version = \"$CLEAN_VERSION\"/" pyproject.toml
      - if: steps.check_recursive.outputs.skip != 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if git commit -am "Automatically update version to $CLEAN_VERSION"; then
            git push
            git tag -f -a "v$CLEAN_VERSION" -m "v$CLEAN_VERSION"
            git push -f --tags
          else
            echo "No source change detected on version update (did you repeat a release tag??)"
            exit 1
          fi

  rebuild:
    needs: update-versions
    if: needs.update-versions.outputs.skip != 'true'
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      ref: master
      vite_base: ${{ vars.PAGES_BASE || '' }}

  deploy-pages:
    needs: rebuild
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: (cd site && zip -r "$GITHUB_WORKSPACE/frontend.zip" .)
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: frontend.zip
          tag: ${{ github.ref }}
          overwrite: true

  deploy-pypi:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/

  deploy-docker:
    needs: rebuild
    if: ${{ vars.DOCKERHUB_IMAGE != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
