name: Build artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: Commit SHA, branch name, or tag to check out
      vite_base:
        type: string
        required: false
        default: ""
        description: Optional Vite base path for static hosting (e.g. /repo-name/ for GitHub project Pages)

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build frontend (static site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Enable Corepack
        # Run BEFORE any yarn invocation. setup-node's `cache: yarn` would call
        # `yarn cache dir` against the runner's pre-installed Yarn 1, which
        # errors out because package.json#packageManager pins Yarn 4.
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
        env:
          VITE_BASE: ${{ inputs.vite_base }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-dist
          path: dist
          retention-days: 5

  build-python-package:
    name: Build Python package (sdist and wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: export CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD=true && uv sync --frozen
      - run: export CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD=true && uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist
          retention-days: 5

  build-docker:
    name: Build Docker image (validate, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          # amd64 only to keep build times down. The old wheel blocker is gone:
          # build123d 0.11.x uses cadquery-ocp-novtk 7.9.x, which publishes
          # manylinux_2_31_aarch64 wheels, so linux/arm64 can be added here
          # whenever the extra CI time is worth it.
          platforms: linux/amd64
          tags: cadquery-web-viewer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-python:
    name: Test Python (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 is omitted only because `requires-python` still caps at
        # <3.13; the old vtk==9.3.1 blocker is gone (build123d 0.11.x depends on
        # cadquery-ocp-novtk 7.9.x, which ships cp313/cp314 wheels). Add 3.13
        # here together with widening `requires-python` in pyproject.toml.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        env:
          CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD: "true"
        run: uv sync --extra dev
      - name: Ruff
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: uv run ruff check cadquery_web_viewer hatch_build.py
      - name: Pyright
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: uv run pyright
      - name: Tests with coverage
        run: uv run coverage run -m unittest discover -s tests -v
      - name: Coverage XML
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: uv run coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-frontend:
    name: Test frontend (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: lts/*
          check-latest: true
      - name: Enable Corepack
        # Run BEFORE any yarn invocation. setup-node's `cache: yarn` would call
        # `yarn cache dir` against the runner's pre-installed Yarn 1, which
        # errors out because package.json#packageManager pins Yarn 4.
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn type-check
