name: Build artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: Commit SHA, branch name, or tag to check out
      vite_base:
        type: string
        required: false
        default: ""
        description: Optional Vite base path for static hosting (e.g. /repo-name/ for GitHub project Pages)

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build frontend (static site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          VITE_BASE: ${{ inputs.vite_base }}
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 5

  build-python-package:
    name: Build Python package (sdist and wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: export CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD=true && uv sync --frozen
      - run: export CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD=true && uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist
          retention-days: 5

  build-docker:
    name: Build Docker image (validate, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: cadquery-web-viewer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-logo:
    name: Build logo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: export CADQUERY_WEB_VIEWER_SKIP_FRONTEND_BUILD=true && uv run --frozen python cadquery_web_viewer/logo.py
      - uses: actions/upload-artifact@v7
        with:
          name: logo
          path: assets/logo_build
          retention-days: 5
