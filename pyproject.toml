[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadquery-web-viewer"
version = "0.10.16"
description = "Web server and viewer for GLB/CAD preview (forked from Yet Another CAD Viewer)"
authors = [{ name = "Yeicor", email = "4929005+Yeicor@users.noreply.github.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.10,<0.11",
    "flask>=3.0",
    "httpx>=0.27,<1",
    "pygltflib>=1.16",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[project.scripts]
cadquery-web-viewer = "cadquery_web_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = [ "cadquery_web_viewer" ]
include = [ "/cadquery_web_viewer/frontend" ]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [ "/*" ] # Include all backend and frontend files to build complete project from python sdist

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["cadquery_web_viewer", "hatch_build.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"cadquery_web_viewer/logo.py" = ["F403", "F405"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["cadquery_web_viewer", "hatch_build.py"]
exclude = ["cadquery_web_viewer/frontend", "cadquery_web_viewer/logo.py"]
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportArgumentType = false
reportReturnType = false
reportAssignmentType = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportPrivateUsage = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false

