# Yarn 4 (Berry) configuration. See https://yarnpkg.com/configuration/yarnrc.
#
# nodeLinker: node-modules — keep the same on-disk layout as Yarn 1 so Vite's
# resolve.dedupe of `three` and the @google/model-viewer integration behave
# identically. PnP would require investigating each consumer of node_modules
# layout (Vite plugins, vue-tsc, generate-license-file) and is not worth it for
# a viewer with a Three.js dedupe constraint.
nodeLinker: node-modules

# Cache shared across projects on this machine, not committed to the repo.
enableGlobalCache: true
